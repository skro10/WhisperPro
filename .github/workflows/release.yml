name: release-windows-installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm install

      - name: Ensure VC++ redistributable payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/resources/redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "apps/desktop/src-tauri/resources/redist/vc_redist.x64.exe"

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri:build

      - name: Resolve installer path
        id: installer
        shell: powershell
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis" -Filter "*-setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Installer not found in target/release/bundle/nsis" }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
          generate_release_notes: true
